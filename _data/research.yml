intro: "My research examines how AI systems shape human judgment and decision-making, especially in contexts of explanation, communication, and public-facing decisions. Drawing on human-AI interaction, behavioral science, and technology governance, I design and evaluate interventions that make AI use more transparent, reflective, and socially aware."
areas:
  - Human-AI Interaction
  - Behavioral Science
  - Technology Governance
  - AI Explanation and Communication
  - Public-Facing Decision Systems
  - Computational Social Science
questions:
  - How do AI explanations shape user understanding, trust, and judgment?
  - When do people defer to algorithmic systems, and when do they question them?
  - How can interface design support more reflective human decision-making?
  - How should public institutions communicate AI-mediated decisions?
  - What forms of governance make AI systems accountable in everyday use?
projects:
