featuredProjects:
  - title: MyStyle / Digital Preferences Modeling
    meta: "Interactive Generative-AI Exhibit · Booth Mindworks · 2025–Present"
    statusNote: "Beta testing · site not fully open"
    description: "An online interactive exhibit that models individual preferences from participant choices and uses generative AI to visualize what people like."
    problem: "Preference experiments need to capture participant choices, preserve session and group structure, and connect those records to generative models."
    stack: "Python · FastAPI · SQLModel/Alembic · PostgreSQL · Redis/RQ · PyTorch/StyleGAN2 · Docker · S3/EC2"
    mediaLabel: "Interactive exhibit preview"
    media: "Preference modeling interface preview"
    mediaImage: "/images/projects/digiprefer.png"
    mediaAlt: "MyStyle digital preferences exhibit start screen asking what catches your eye."
    links:
      - label: Website
        href: "https://www.digital-preferences-modeling.com/"
  - title: Mapademic · 脉谱学术
    meta: "Interactive Visualization · 2025 CAPP 30122"
    description: "An interactive visualization platform for exploring the global distribution and temporal evolution of academic research."
    problem: "Academic research is difficult to explore across geography, time, and topic. Mapademic makes research concentration, regional academic activity, and field-level trends easier to see and compare."
    stack: "Python · Streamlit · Plotly · Pandas · NumPy · GeoJSON · ScienceDirect API · Natural Earth"
    mediaLabel: "Map / interface preview"
    media: "Geospatial research-density visualization preview"
    mediaImage: "/images/projects/mapademic.png"
    mediaAlt: "Mapademic interface showing a world map of academic paper density by region."
    links:
      - label: GitHub
        href: "https://github.com/Jalkey-Chen/Mapademic"
