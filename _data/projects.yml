  - title: Mapademic · 脉谱学术
    meta: "Interactive Visualization · 2025 · Team Project"
    description: "An interactive visualization platform for exploring the global distribution and temporal evolution of academic research."
    problem: "Academic research is difficult to explore across geography, time, and topic. Mapademic makes research concentration, regional academic activity, and field-level trends easier to see and compare."
    builtLabel: Contribution
    built: "Contributed to visualization design and program management for a Streamlit-based platform that combines bibliometric data, geospatial mapping, keyword search, timeline exploration, and word-frequency analysis."
    stack: "Python · Streamlit · Plotly · Pandas · NumPy · GeoJSON · ScienceDirect API · Natural Earth"
    role: "Visualization and program management"
    mediaLabel: "Map / interface preview"
    media: "Geospatial research-density visualization preview"
    mediaImage: "/images/projects/mapademic.png"
    mediaAlt: "Mapademic interface showing a world map of academic paper density by region."
    links:
      - label: GitHub
        href: "https://github.com/Jalkey-Chen/Mapademic"
