{% assign is_home = false %}
{% if page.url == "/" %}
  {% assign is_home = true %}
{% endif %}

<header class="site-header academic-hero__nav" aria-label="Primary">
  <a class="academic-hero__brand{% if is_home %} is-active{% endif %}" href="{% if is_home %}#now{% else %}{{ '/#now' | relative_url }}{% endif %}"{% if is_home %} aria-current="page"{% endif %}>About</a>
  <nav class="academic-hero__links" aria-label="Primary navigation">
    {% for link in site.data.navigation.main %}
      {% assign is_current = false %}
      {% if page.url == link.url %}
        {% assign is_current = true %}
      {% endif %}
      <a href="{{ link.url | relative_url }}"{% if is_current %} class="is-active" aria-current="page"{% endif %}>{{ link.title }}</a>
    {% endfor %}
  </nav>
</header>
