<div class="masonry-gallery">
  {% for photo in include.photos %}
    <figure class="photo-item" tabindex="0">
      <img src="{{ photo.src | relative_url }}" alt="{{ photo.alt }}" loading="lazy">
      <figcaption class="photo-caption">
        <span class="photo-caption__title">{{ photo.title }}</span>
        <span class="photo-caption__text">{{ photo.text }}</span>
      </figcaption>
    </figure>
  {% endfor %}
</div>
