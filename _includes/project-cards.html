{% for project in include.projects %}
  <div class="project-card">
    <img src="{{ project.image | relative_url }}" alt="{{ project.image_alt }}" class="project-img" loading="lazy">
    <div class="project-text">
      <h3>{{ project.title }}</h3>
      <p>{{ project.description }}</p>
    </div>
  </div>
{% endfor %}
